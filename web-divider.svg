<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 44" width="1000" height="44" role="img" aria-label="divider">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8EEF7" stop-opacity="0"/>
      <stop offset="18%" stop-color="#E8EEF7" stop-opacity=".28"/>
      <stop offset="82%" stop-color="#E8EEF7" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#E8EEF7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="beam"><stop offset="0%" stop-color="#E62429" stop-opacity=".9"/><stop offset="100%" stop-color="#E62429" stop-opacity="0"/></radialGradient>
    <path id="rail" d="M40 24 L960 24"/>
    <style>
      .fadein{opacity:0;animation:fi 1.2s ease-out forwards}
      @keyframes fi{to{opacity:1}}
      @media (prefers-reduced-motion:reduce){.fadein{animation:none;opacity:1}}
    </style>
  </defs>

  <rect x="0" y="23" width="1000" height="1.2" fill="url(#fade)"/>
  <g class="fadein" fill="none" stroke="#E8EEF7" stroke-width="1" opacity=".2">
    <path d="M40 24 L52 14 M40 24 L52 34 M960 24 L948 14 M960 24 L948 34"/>
  </g>
  <text x="20" y="29" font-family="'SF Mono',Consolas,monospace" font-size="13" fill="#E62429" opacity=".8">❯</text>

  <ellipse cx="0" cy="24" rx="90" ry="9" fill="url(#beam)">
    <animate attributeName="cx" values="-60;1060" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <g>
    <g stroke="#E62429" stroke-width="1.2" fill="none">
      <path d="M0 0 L-8 -6 M0 0 L-10 0 M0 0 L-8 6 M0 0 L8 -6 M0 0 L10 0 M0 0 L8 6"/>
    </g>
    <ellipse cx="0" cy="1" rx="4" ry="5.2" fill="#E62429"/>
    <circle cx="0" cy="-5" r="2.3" fill="#1B72BE"/>
    <animateMotion dur="14s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear">
      <mpath href="#rail"/>
    </animateMotion>
  </g>
</svg>
