<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 60" width="1000" height="60" role="img" aria-label="section divider">
  <defs>
    <path id="strand" d="M0 20 Q125 44 250 22 T500 24 T750 22 T1000 20"/>
    <style>
      .line { fill:none; stroke:#E8EEF7; stroke-width:1.6; opacity:.5;
              stroke-dasharray:1100; stroke-dashoffset:1100;
              animation:draw 2.2s ease-out forwards; }
      .drop { fill:none; stroke:#E8EEF7; stroke-width:1; opacity:.28; }
      @keyframes draw { to { stroke-dashoffset:0 } }
      @media (prefers-reduced-motion: reduce){ .line{animation:none; stroke-dashoffset:0} }
    </style>
  </defs>

  <use href="#strand" class="line"/>
  <g class="drop">
    <path d="M120 33 L120 52 M280 26 L280 46 M430 30 L430 50 M620 27 L620 47 M810 28 L810 48"/>
    <path d="M104 40 Q120 46 136 40 M264 34 Q280 40 296 34 M414 38 Q430 44 446 38
             M604 35 Q620 41 636 35 M794 36 Q810 42 826 36"/>
  </g>

  <g>
    <g stroke="#E62429" stroke-width="1.3" fill="none">
      <path d="M0 0 L-9 -7 M0 0 L-11 0 M0 0 L-9 7 M0 0 L-5 12"/>
      <path d="M0 0 L9 -7 M0 0 L11 0 M0 0 L9 7 M0 0 L5 12"/>
    </g>
    <ellipse cx="0" cy="2" rx="4.5" ry="6" fill="#E62429"/>
    <circle cx="0" cy="-5" r="2.6" fill="#1B72BE"/>
    <animateMotion dur="12s" repeatCount="indefinite" rotate="auto"
      keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear">
      <mpath href="#strand"/>
    </animateMotion>
  </g>
</svg>
