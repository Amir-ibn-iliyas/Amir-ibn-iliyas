<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Amir ibn Iliyas — Full Stack Developer">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#04050A"/><stop offset="45%" stop-color="#0B1020"/>
    <stop offset="78%" stop-color="#161029"/><stop offset="100%" stop-color="#1A0810"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#E8EEF7" stop-opacity=".30"/>
    <stop offset="100%" stop-color="#E8EEF7" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="redHaze" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#E62429" stop-opacity=".28"/>
    <stop offset="100%" stop-color="#E62429" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#E62429"/><stop offset="45%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#1B72BE"/>
  </linearGradient>
  <filter id="rGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#E62429" flood-opacity=".8"/>
  </filter>
  <filter id="bGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#1B72BE" flood-opacity=".9"/>
  </filter>
  <clipPath id="frame"><rect x="0" y="0" width="1000" height="340"/></clipPath>

  <!-- the web-slinger, drawn once, reused for the motion trail -->
  <g id="slinger">
    <line x1="0" y1="-150" x2="-4" y2="6" stroke="#E8EEF7" stroke-width="2" opacity=".8"/>
    <g fill="#E62429">
      <path d="M-4 8 L-9 32 L-2 34 L2 10 Z"/>
      <circle cx="0" cy="40" r="10"/>
      <path d="M-9 49 L9 49 L13 76 L-12 76 Z"/>
      <path d="M8 53 L36 62 L34 69 L6 61 Z"/>
      <path d="M-11 76 L-27 103 L-19 108 L-5 82 Z"/>
      <path d="M7 76 L23 95 L16 101 L1 83 Z"/>
    </g>
    <g fill="#1B72BE">
      <path d="M-12 68 L13 68 L13 76 L-12 76 Z"/>
      <path d="M-11 76 L-27 103 L-23 105 L-8 80 Z"/>
      <path d="M16 101 L23 95 L18 88 L11 94 Z"/>
    </g>
  </g>

  <style>
    .drawn { stroke-dasharray:1400; stroke-dashoffset:1400; animation:draw 2.8s ease-out forwards }
    .d2 { animation-delay:.25s } .d3 { animation-delay:.5s }
    @keyframes draw { to { stroke-dashoffset:0 } }

    .star { fill:#E8EEF7; animation:tw 3.6s ease-in-out infinite }
    @keyframes tw { 0%,100%{opacity:.12} 50%{opacity:.95} }

    .win { fill:#F0A202; opacity:.5 }
    .flick { animation:fl 5s steps(1) infinite }
    @keyframes fl { 0%,40%{opacity:.5} 44%,56%{opacity:.05} 60%,100%{opacity:.5} }

    .rain { stroke:#8FA3BF; stroke-width:1; opacity:.22; animation:fall 1.1s linear infinite }
    @keyframes fall { from{transform:translate(0,-60px)} to{transform:translate(-14px,400px)} }

    .rise { opacity:0; animation:rise 1s ease-out forwards }
    .r2 { animation-delay:1.05s } .r3 { animation-delay:1.35s }
    @keyframes rise { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

    .breathe { animation:br 3.2s ease-in-out infinite }
    @keyframes br { 0%,100%{opacity:.45} 50%{opacity:1} }

    .ttl { font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif; font-weight:bold; letter-spacing:8px }
    .lbl { font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif; font-weight:bold; letter-spacing:4px }

    @media (prefers-reduced-motion:reduce){
      .drawn,.star,.flick,.rain,.rise,.breathe{animation:none!important;stroke-dashoffset:0;opacity:1}
    }
  </style>
</defs>

<g clip-path="url(#frame)">
  <rect width="1000" height="340" fill="url(#sky)"/>
  <ellipse cx="500" cy="330" rx="520" ry="150" fill="url(#redHaze)"/>

  <!-- stars -->
  <g>
    <circle class="star" cx="88" cy="40" r="1.4"/><circle class="star" cx="214" cy="74" r="1.1" style="animation-delay:.7s"/>
    <circle class="star" cx="352" cy="32" r="1.5" style="animation-delay:1.4s"/><circle class="star" cx="470" cy="96" r="1.1" style="animation-delay:2.1s"/>
    <circle class="star" cx="640" cy="44" r="1.3" style="animation-delay:.4s"/><circle class="star" cx="905" cy="118" r="1.2" style="animation-delay:1.7s"/>
    <circle class="star" cx="762" cy="26" r="1.5" style="animation-delay:2.6s"/><circle class="star" cx="140" cy="120" r="1.1" style="animation-delay:1.1s"/>
  </g>

  <!-- moon -->
  <circle cx="856" cy="66" r="70" fill="url(#glow)"/>
  <circle cx="856" cy="66" r="28" fill="#E8EEF7" opacity=".9"/>
  <circle cx="867" cy="57" r="28" fill="#0B1020"/>

  <!-- far skyline, slow parallax drift -->
  <g fill="#141B2E" opacity=".75">
    <animateTransform attributeName="transform" type="translate" values="0 0; -26 0; 0 0" dur="26s" repeatCount="indefinite"/>
    <rect x="-30" y="214" width="120" height="130"/><rect x="110" y="186" width="82" height="158"/>
    <rect x="214" y="230" width="104" height="114"/><rect x="342" y="200" width="76" height="144"/>
    <rect x="440" y="238" width="118" height="106"/><rect x="580" y="192" width="88" height="152"/>
    <rect x="690" y="228" width="96" height="116"/><rect x="808" y="204" width="80" height="140"/>
    <rect x="908" y="232" width="128" height="112"/>
  </g>

  <!-- web canopy -->
  <g stroke="#E8EEF7" fill="none" stroke-width="1.1" opacity=".38" stroke-linecap="round">
    <path class="drawn" d="M0 0 L164 0 M0 0 L150 62 M0 0 L118 118 M0 0 L60 152 M0 0 L0 168"/>
    <path class="drawn d2" d="M50 0 L47 47 L0 50 M92 0 L86 86 L0 92 M136 0 L128 128 L0 136"/>
    <path class="drawn" d="M1000 0 L836 0 M1000 0 L850 62 M1000 0 L882 118 M1000 0 L940 152 M1000 0 L1000 168"/>
    <path class="drawn d2" d="M950 0 L953 47 L1000 50 M908 0 L914 86 L1000 92 M864 0 L872 128 L1000 136"/>
    <path class="drawn d3" d="M164 0 Q330 46 500 22 Q670 46 836 0"/>
    <path class="drawn d3" d="M240 8 Q380 62 500 44 Q620 62 760 8"/>
  </g>

  <!-- rain -->
  <g class="rain">
    <line x1="60" y1="0" x2="54" y2="18"/><line x1="180" y1="-30" x2="174" y2="-12" style="animation-delay:.3s"/>
    <line x1="300" y1="-14" x2="294" y2="4" style="animation-delay:.6s"/><line x1="430" y1="-44" x2="424" y2="-26" style="animation-delay:.15s"/>
    <line x1="560" y1="-8" x2="554" y2="10" style="animation-delay:.75s"/><line x1="690" y1="-36" x2="684" y2="-18" style="animation-delay:.45s"/>
    <line x1="820" y1="-20" x2="814" y2="-2" style="animation-delay:.9s"/><line x1="950" y1="-50" x2="944" y2="-32" style="animation-delay:.2s"/>
  </g>

  <!-- swing traversal: motion trail then the figure -->
  <g opacity=".16">
    <animateTransform attributeName="transform" type="translate" begin="-0.34s"
      values="-170 96; 300 30; 700 96; 1170 30" keyTimes="0;.34;.67;1"
      calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1" dur="11s" repeatCount="indefinite"/>
    <g><animateTransform attributeName="transform" type="rotate" begin="-0.34s"
        values="-30 0 -150; 24 0 -150; -30 0 -150" calcMode="spline"
        keySplines=".37 0 .63 1;.37 0 .63 1" dur="2.6s" repeatCount="indefinite"/>
      <use href="#slinger"/></g>
  </g>
  <g opacity=".3">
    <animateTransform attributeName="transform" type="translate" begin="-0.17s"
      values="-170 96; 300 30; 700 96; 1170 30" keyTimes="0;.34;.67;1"
      calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1" dur="11s" repeatCount="indefinite"/>
    <g><animateTransform attributeName="transform" type="rotate" begin="-0.17s"
        values="-30 0 -150; 24 0 -150; -30 0 -150" calcMode="spline"
        keySplines=".37 0 .63 1;.37 0 .63 1" dur="2.6s" repeatCount="indefinite"/>
      <use href="#slinger"/></g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="-170 96; 300 30; 700 96; 1170 30" keyTimes="0;.34;.67;1"
      calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1" dur="11s" repeatCount="indefinite"/>
    <g><animateTransform attributeName="transform" type="rotate"
        values="-30 0 -150; 24 0 -150; -30 0 -150" calcMode="spline"
        keySplines=".37 0 .63 1;.37 0 .63 1" dur="2.6s" repeatCount="indefinite"/>
      <use href="#slinger"/></g>
  </g>

  <!-- near skyline -->
  <g fill="#04060C">
    <rect x="0" y="256" width="96" height="88"/><rect x="102" y="224" width="70" height="120"/>
    <rect x="178" y="272" width="86" height="72"/><rect x="270" y="240" width="62" height="104"/>
    <rect x="338" y="282" width="104" height="62"/><rect x="448" y="234" width="74" height="110"/>
    <rect x="528" y="270" width="66" height="74"/><rect x="600" y="248" width="94" height="96"/>
    <rect x="700" y="284" width="78" height="60"/><rect x="784" y="230" width="70" height="114"/>
    <rect x="860" y="278" width="96" height="66"/><rect x="962" y="250" width="86" height="94"/>
  </g>
  <g class="win">
    <rect x="114" y="238" width="7" height="10"/><rect x="132" y="238" width="7" height="10" class="flick"/>
    <rect x="114" y="260" width="7" height="10"/><rect x="150" y="282" width="7" height="10"/>
    <rect x="282" y="254" width="7" height="10" class="flick"/><rect x="304" y="276" width="7" height="10"/>
    <rect x="460" y="248" width="7" height="10"/><rect x="484" y="248" width="7" height="10" class="flick"/>
    <rect x="460" y="272" width="7" height="10"/><rect x="498" y="296" width="7" height="10"/>
    <rect x="614" y="262" width="7" height="10"/><rect x="646" y="262" width="7" height="10" class="flick"/>
    <rect x="614" y="290" width="7" height="10"/><rect x="796" y="244" width="7" height="10" class="flick"/>
    <rect x="818" y="266" width="7" height="10"/><rect x="796" y="292" width="7" height="10"/>
    <rect x="976" y="264" width="7" height="10"/><rect x="1004" y="264" width="7" height="10" class="flick"/>
  </g>

  <!-- type block -->
  <g class="rise">
    <rect x="300" y="196" width="400" height="1.5" fill="#1B72BE" opacity=".55"/>
    <text class="ttl" x="500" y="252" text-anchor="middle" font-size="44" fill="url(#ttl)" filter="url(#rGlow)">AMIR IBN ILIYAS</text>
  </g>
  <g class="rise r2">
    <text class="lbl" x="500" y="280" text-anchor="middle" font-size="12.5" fill="#9DB0CB">
      FULL&#160;STACK&#160;DEVELOPER &#160;&#183;&#160; NEXT.JS &#183; REACT &#183; NODE &#183; AI
    </text>
  </g>
  <g class="rise r3">
    <text class="lbl" x="500" y="308" text-anchor="middle" font-size="11" fill="#E62429" filter="url(#bGlow)" opacity=".9">
      BUILDING WITH PURPOSE AND TAWAKKUL
    </text>
    <rect class="breathe" x="352" y="299" width="76" height="1.4" fill="#1B72BE"/>
    <rect class="breathe" x="572" y="299" width="76" height="1.4" fill="#1B72BE"/>
  </g>
</g>
</svg>
