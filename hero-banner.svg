<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Amir ibn Iliyas - Full Stack Developer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05060B"/>
      <stop offset="55%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#12060B"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8EEF7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8EEF7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E62429"/>
      <stop offset="50%" stop-color="#F5F7FA"/>
      <stop offset="100%" stop-color="#1B72BE"/>
    </linearGradient>
    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#E62429" flood-opacity="0.75"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#1B72BE" flood-opacity="0.9"/>
    </filter>

    <style>
      .web    { stroke:#E8EEF7; fill:none; stroke-width:1.1; opacity:.42; stroke-linecap:round;
                stroke-dasharray:900; stroke-dashoffset:900; animation:spin-web 2.6s ease-out forwards; }
      .web.d1 { animation-delay:.15s } .web.d2 { animation-delay:.35s } .web.d3 { animation-delay:.55s }
      @keyframes spin-web { to { stroke-dashoffset:0 } }

      .star   { fill:#E8EEF7; animation:twinkle 3.4s ease-in-out infinite; }
      @keyframes twinkle { 0%,100%{opacity:.15} 50%{opacity:.9} }

      .win    { fill:#F0A202; opacity:.55; }
      .win.f  { animation:flick 4.5s steps(1) infinite; }
      @keyframes flick { 0%,42%{opacity:.55} 46%,58%{opacity:.08} 62%,100%{opacity:.55} }

      .title  { font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif; font-weight:bold;
                letter-spacing:7px; }
      .sub    { font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif; font-weight:bold;
                letter-spacing:4.5px; fill:#8FA3BF; }
      .fadeup { opacity:0; animation:fadeup 1.1s ease-out forwards; }
      .fadeup.b { animation-delay:.9s } .fadeup.c { animation-delay:1.25s }
      @keyframes fadeup { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)} }

      .pulse  { animation:pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:.55} 50%{opacity:1} }

      @media (prefers-reduced-motion: reduce) {
        .web,.star,.win.f,.fadeup,.pulse { animation:none !important; stroke-dashoffset:0; opacity:1 }
      }
    </style>
  </defs>

  <rect width="1000" height="320" fill="url(#sky)"/>

  <!-- stars -->
  <g>
    <circle class="star" cx="120" cy="46" r="1.5" style="animation-delay:0s"/>
    <circle class="star" cx="248" cy="88" r="1.2" style="animation-delay:.6s"/>
    <circle class="star" cx="392" cy="38" r="1.6" style="animation-delay:1.2s"/>
    <circle class="star" cx="612" cy="62" r="1.2" style="animation-delay:.3s"/>
    <circle class="star" cx="742" cy="34" r="1.5" style="animation-delay:1.8s"/>
    <circle class="star" cx="905" cy="96" r="1.3" style="animation-delay:.9s"/>
    <circle class="star" cx="176" cy="132" r="1.1" style="animation-delay:2.4s"/>
    <circle class="star" cx="836" cy="150" r="1.1" style="animation-delay:1.5s"/>
  </g>

  <!-- moon -->
  <circle cx="828" cy="70" r="62" fill="url(#moonGlow)"/>
  <circle cx="828" cy="70" r="26" fill="#E8EEF7" opacity=".92"/>
  <circle cx="838" cy="62" r="26" fill="#0B1020" opacity=".95"/>

  <!-- corner webs -->
  <g>
    <path class="web d1" d="M0 0 L150 0 M0 0 L140 55 M0 0 L112 112 M0 0 L55 140 M0 0 L0 150"/>
    <path class="web d2" d="M46 0 L43 43 L0 46 M84 0 L79 79 L0 84 M124 0 L117 117 L0 124"/>
    <path class="web d1" d="M1000 0 L850 0 M1000 0 L860 55 M1000 0 L888 112 M1000 0 L945 140 M1000 0 L1000 150"/>
    <path class="web d3" d="M954 0 L957 43 L1000 46 M916 0 L921 79 L1000 84 M876 0 L883 117 L1000 124"/>
  </g>

  <!-- skyline -->
  <g fill="#080B14">
    <rect x="0" y="228" width="86" height="92"/>
    <rect x="92" y="196" width="64" height="124"/>
    <rect x="162" y="248" width="78" height="72"/>
    <rect x="246" y="212" width="58" height="108"/>
    <rect x="310" y="256" width="96" height="64"/>
    <rect x="412" y="204" width="70" height="116"/>
    <rect x="488" y="244" width="62" height="76"/>
    <rect x="556" y="220" width="88" height="100"/>
    <rect x="650" y="258" width="72" height="62"/>
    <rect x="728" y="200" width="66" height="120"/>
    <rect x="800" y="252" width="90" height="68"/>
    <rect x="896" y="222" width="104" height="98"/>
  </g>
  <g class="win">
    <rect x="104" y="210" width="7" height="10"/><rect x="120" y="210" width="7" height="10"/>
    <rect x="104" y="232" width="7" height="10" class="win f"/><rect x="136" y="232" width="7" height="10"/>
    <rect x="258" y="226" width="7" height="10"/><rect x="276" y="248" width="7" height="10" class="win f"/>
    <rect x="424" y="218" width="7" height="10" class="win f"/><rect x="446" y="218" width="7" height="10"/>
    <rect x="424" y="242" width="7" height="10"/><rect x="458" y="264" width="7" height="10"/>
    <rect x="570" y="236" width="7" height="10"/><rect x="600" y="236" width="7" height="10" class="win f"/>
    <rect x="570" y="262" width="7" height="10"/><rect x="618" y="284" width="7" height="10"/>
    <rect x="740" y="214" width="7" height="10"/><rect x="762" y="236" width="7" height="10" class="win f"/>
    <rect x="740" y="260" width="7" height="10"/><rect x="912" y="238" width="7" height="10"/>
    <rect x="940" y="238" width="7" height="10" class="win f"/><rect x="912" y="266" width="7" height="10"/>
    <rect x="968" y="266" width="7" height="10"/>
  </g>

  <!-- swinging web-slinger silhouette (pendulum about an anchor above the frame) -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-26 500 -60; 24 500 -60; -26 500 -60"
      keyTimes="0;0.5;1" calcMode="spline"
      keySplines="0.37 0 0.63 1; 0.37 0 0.63 1"
      dur="4.6s" repeatCount="indefinite"/>

    <!-- web line -->
    <line x1="500" y1="-60" x2="497" y2="104" stroke="#E8EEF7" stroke-width="2" opacity=".85"/>
    <circle cx="497" cy="104" r="2.6" fill="#E8EEF7" opacity=".9"/>

    <!-- figure -->
    <g fill="#E62429">
      <path d="M497 106 L493 128 L499 130 L503 108 Z"/>
      <circle cx="500" cy="134" r="9.5"/>
      <path d="M492 142 L508 142 L512 168 L489 168 Z"/>
      <path d="M507 146 L534 156 L532 162 L505 154 Z"/>
      <path d="M490 168 L476 194 L483 198 L496 174 Z"/>
      <path d="M506 168 L520 186 L514 192 L500 175 Z"/>
    </g>
    <g fill="#1B72BE">
      <path d="M489 160 L512 160 L512 168 L489 168 Z"/>
      <path d="M490 168 L476 194 L480 196 L493 172 Z"/>
    </g>
  </g>

  <!-- descending spider on a thread -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 -46; 0 26; 0 -46" keyTimes="0;0.5;1"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"
      dur="7s" repeatCount="indefinite"/>
    <line x1="176" y1="-80" x2="176" y2="84" stroke="#E8EEF7" stroke-width="1" opacity=".5"/>
    <g stroke="#E8EEF7" stroke-width="1.3" fill="none" opacity=".85">
      <path d="M176 88 L166 80 M176 88 L164 88 M176 88 L166 96 M176 88 L170 102"/>
      <path d="M176 88 L186 80 M176 88 L188 88 M176 88 L186 96 M176 88 L182 102"/>
    </g>
    <ellipse cx="176" cy="90" rx="5" ry="6.5" fill="#E62429"/>
    <circle cx="176" cy="83" r="3" fill="#0B1020"/>
  </g>

  <!-- type -->
  <g class="fadeup">
    <text class="title" x="500" y="252" text-anchor="middle" font-size="40"
          fill="url(#titleFill)" filter="url(#redGlow)">AMIR IBN ILIYAS</text>
  </g>
  <g class="fadeup b">
    <text class="sub" x="500" y="280" text-anchor="middle" font-size="13">
      FULL STACK DEVELOPER &#160;&#183;&#160; NEXT.JS &#183; REACT &#183; NODE &#183; AI
    </text>
  </g>
  <g class="fadeup c">
    <text class="sub pit" x="500" y="304" text-anchor="middle" font-size="11" fill="#E62429"
          filter="url(#softGlow)" opacity=".85">BUILDING WITH PURPOSE AND TAWAKKUL</text>
    <rect class="pulse" x="392" y="292" width="60" height="1.4" fill="#1B72BE"/>
    <rect class="pulse" x="548" y="292" width="60" height="1.4" fill="#1B72BE"/>
  </g>
</svg>
